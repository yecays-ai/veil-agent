<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEIL</title>
<style>
:root{--bg:#faf8f4;--panel:#fff;--text:#2b2a28;--muted:#8a867e;--line:#e8e4dc;--me:#e9e2d3;--accent:#5b6f8f;--warn:#fff4dc}
:root[data-theme=dark]{--bg:#1d1d1f;--panel:#27272a;--text:#e8e6e1;--muted:#9a978f;--line:#38383c;--me:#3a3a40;--accent:#8fa6c9;--warn:#3a3322}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header button{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 10px;cursor:pointer}
header button:hover{color:var(--text)}
#log{flex:1;overflow-y:auto;padding:18px 16px}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);background:var(--panel)}
.msg.user{align-self:flex-end;background:var(--me);border-color:transparent}
.msg.assistant{align-self:flex-start}
.msg.grouped{margin-top:-8px}
.timestamp{align-self:center;color:var(--muted);font-size:12px}
.msg code{font-family:Consolas,monospace;font-size:.92em;background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px}
.msg pre{margin:6px 0;padding:10px;background:rgba(127,127,127,.12);border-radius:8px;overflow-x:auto;white-space:pre}
.msg pre code{background:none;padding:0}
.notice{align-self:center;max-width:92%;font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word;text-align:center}
.error{align-self:center;color:#b3402f;font-size:15px;white-space:pre-wrap}
.approval{align-self:stretch;background:var(--warn);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.approval p{margin:0 0 10px;white-space:pre-wrap}
.approval button{font:inherit;padding:6px 18px;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin-right:8px;background:var(--panel);color:var(--text)}
.approval button.yes{background:var(--accent);color:#fff;border-color:var(--accent)}
.approval.done button{display:none}
.approval .status{font-size:14px;color:var(--muted)}
#typing{align-self:flex-start;color:var(--muted);font-size:14px;padding-left:6px}
footer{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
.bar{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.speech-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.speech-tools select,.speech-tools button{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--bg);color:var(--text);cursor:pointer}
.speech-tools button[aria-pressed="true"]{background:var(--warn);border-color:var(--accent)}
.speech-tools button:disabled,.speech-tools select:disabled{opacity:.55;cursor:default}
#speech-status{font-size:12px;color:var(--muted);min-width:8em}
#speech-status[data-state="listening"],#speech-status[data-state="processing"]{color:var(--accent)}
#speech-status[data-state="error"]{color:#b3402f}
textarea{flex:1;min-width:0;font:inherit;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);color:var(--text);max-height:200px;outline:none}
textarea:focus{border-color:var(--accent)}
#send{font:inherit;border:0;border-radius:12px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer}
#send:disabled{opacity:.45;cursor:default}
#offline{display:none;background:#b3402f;color:#fff;text-align:center;padding:6px;font-size:14px}
#runtime{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:14px}
#runtime .label{color:var(--muted)}
#runtime button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer}
#runtime button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="ended" style="display:none;text-align:center;padding:6px;font-size:14px;background:var(--me)">服务已退出，可以关掉这个页面；下次双击 start-web.bat 可重新启动。</div>
<div id="offline">和 Peter 本机服务断开了：服务可能仍在后台运行。请重新双击 start-web.bat 回到同一聊天。</div>
<header>
  <h1 id="title">VEIL</h1>
  <button id="new-chat" title="保留旧聊天，开始一段不继承旧对话的新聊天">新对话</button>
  <button data-cmd="/cost" title="今天和本月的花费">花费</button>
  <button data-cmd="/memory" title="最近的记忆">记忆</button>
  <button id="memory-panel" hidden>记忆面板</button>
  <button id="theme">深色</button>
</header>
<div id="runtime">
  <span class="label" id="service-status">服务运行状态：正在连接…</span>
  <span class="label" id="activity-status">自主活动状态：正在读取…</span>
  <button id="activity-toggle" disabled>读取中…</button>
  <button id="exit-service" disabled>退出服务</button>
</div>
<details id="activity-details" hidden style="padding:0 16px 8px">
  <summary>上次自主活动详情</summary>
  <pre id="activity-record" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
</details>
<div id="log"><div class="col" id="col"></div></div>
<footer><div class="bar">
  <div class="speech-tools">
    <select id="speech-language" aria-label="语音识别语言" aria-describedby="speech-status"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
    <button id="speech-toggle" type="button" aria-label="开始语音识别" aria-describedby="speech-status" aria-pressed="false" title="开始语音识别">🎙</button>
    <span id="speech-status" role="status" aria-live="polite" title="浏览器可能将语音发送到在线识别服务；识别结果不会自动发送">语音输入就绪</span>
  </div>
  <textarea id="box" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div></footer>
<script>
const params=new URLSearchParams(location.search);
let token=params.get('t');
try{if(token)sessionStorage.setItem('veil-t',token);else token=sessionStorage.getItem('veil-t')}catch(e){}
if(params.has('t'))history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id), col=$('col'), log=$('log'), box=$('box'), sendBtn=$('send');
const speechButton=$('speech-toggle'), speechLanguage=$('speech-language'), speechStatus=$('speech-status');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const speechDraftKey='veil-speech-draft';
let speechRecognition=null, speechSession=null, speechState='idle', speechStopRequested=false, speechErrorMessage='', speechDraftActive=false;
let after=0, busy=true, stopping=false, stopped=false, typing=null, sending=false, draftId=null, draftText=null;
let revealQueue=[], revealTimer=null, roundStartedAt=0, roundHasReply=false, previousMessage=null;
let pendingApproval=null, activityEnabled=false, exiting=false;
const GROUP_GAP=15*60*1000;
function speechIsActive(){return speechState==='listening'||speechState==='processing'||!!speechRecognition}
function saveSpeechDraft(value){try{sessionStorage.setItem(speechDraftKey,value)}catch(e){}}
function resizeBox(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,200)+'px'}
function renderSpeechText(finalText,interimText=''){
  const prefix=speechSession.base;
  const spoken=finalText+interimText;
  const separator=prefix&&spoken&&speechSession.language==='en-US'&&!/\s$/.test(prefix)?' ':'';
  box.value=prefix+separator+spoken;
  resizeBox();
  if(finalText)saveSpeechDraft(prefix+(prefix&&finalText&&speechSession.language==='en-US'&&!/\s$/.test(prefix)?' ':'')+finalText);
}
function setSpeechStatus(state,message){
  speechState=state;speechStatus.dataset.state=state;speechStatus.textContent=message;
  const active=speechIsActive();
  speechButton.setAttribute('aria-pressed',String(active));
  speechButton.setAttribute('aria-label',active?'停止语音识别':'开始语音识别');
  speechButton.title=active?'停止语音识别':'开始语音识别';
  speechLanguage.disabled=active||!SpeechRecognition;
  box.disabled=active;
  sendBtn.disabled=busy||revealQueue.length>0||sending||stopping||stopped||active;
}
try{
  const savedSpeechDraft=sessionStorage.getItem(speechDraftKey);
  if(savedSpeechDraft!==null){box.value=savedSpeechDraft;speechDraftActive=true;resizeBox()}
}catch(e){}
if(!SpeechRecognition){speechButton.disabled=true;speechLanguage.disabled=true;setSpeechStatus('error','当前浏览器不支持语音识别，可继续键盘输入。')}
speechButton.onclick=()=>{
  if(speechRecognition){
    speechStopRequested=true;
    setSpeechStatus('processing','正在处理识别结果…');
    try{speechRecognition.stop()}catch(e){speechRecognition.abort()}
    return;
  }
  if(!SpeechRecognition)return;
  speechDraftActive=true;saveSpeechDraft(box.value);
  speechSession={base:box.value,language:speechLanguage.value,finalText:''};
  speechStopRequested=false;speechErrorMessage='';
  const recognition=new SpeechRecognition();speechRecognition=recognition;
  recognition.lang=speechSession.language;recognition.continuous=true;recognition.interimResults=true;
  recognition.onstart=()=>setSpeechStatus('listening','正在监听…再次点击可停止。');
  recognition.onresult=event=>{
    let finalText='',interimText='';
    for(let i=0;i<event.results.length;i++){
      const result=event.results[i],transcript=result[0]?.transcript||'';
      if(result.isFinal)finalText+=transcript;else interimText+=transcript;
    }
    speechSession.finalText=finalText;
    setSpeechStatus('processing','正在处理识别结果…');
    renderSpeechText(finalText,interimText);
    if(!speechStopRequested)setSpeechStatus('listening','正在监听…再次点击可停止。');
  };
  recognition.onerror=event=>{
    const messages={
      'not-allowed':'麦克风权限被拒绝，请在浏览器设置中允许后再试。',
      'service-not-allowed':'浏览器语音识别服务不可用。',
      'no-speech':'没有检测到语音，可以继续打字或重试。',
      'network':'语音识别网络连接失败，可以继续打字。',
      'audio-capture':'没有可用麦克风，请检查设备设置。',
      'language-not-supported':'当前浏览器不支持所选识别语言。',
      'aborted':'语音识别已停止。'
    };
    speechErrorMessage=messages[event.error]||'语音识别失败，可以继续打字或重试。';
    if(event.error==='aborted'&&speechStopRequested)speechErrorMessage='语音识别已停止，可检查文字。';
    setSpeechStatus('error',speechErrorMessage);
  };
  recognition.onend=()=>{
    const finalText=speechSession?.finalText||'';
    if(speechSession){renderSpeechText(finalText);if(finalText)saveSpeechDraft(box.value)}
    speechRecognition=null;speechSession=null;
    if(speechErrorMessage)setSpeechStatus('error',speechErrorMessage);
    else if(finalText)setSpeechStatus('idle','识别完成，可编辑后发送。');
    else if(speechStopRequested)setSpeechStatus('idle','已停止，没有识别到文字。');
    else setSpeechStatus('idle','没有检测到语音，可以继续打字或重试。');
  };
  setSpeechStatus('processing','正在启动语音识别…');
  try{recognition.start()}catch(e){
    speechRecognition=null;speechSession=null;
    setSpeechStatus('error','无法启动语音识别，请检查麦克风权限或稍后重试。');
  }
};
window.addEventListener('pagehide',()=>{
  if(speechSession){
    const finalText=speechSession.finalText||'';
    const prefix=speechSession.base,language=speechSession.language;
    const separator=prefix&&finalText&&language==='en-US'&&!/\s$/.test(prefix)?' ':'';
    saveSpeechDraft(prefix+separator+finalText);
    try{speechRecognition?.abort()}catch(e){}
  }
});
function bubbleDelay(text){const n=Array.from(text).length;return n<=60?1200:n<=200?2400:3600}
function scrollIfFollowing(action){
  const stick=log.scrollHeight-log.scrollTop-log.clientHeight<80;
  action();if(stick)log.scrollTop=log.scrollHeight;
}
function showEvent(e){
  if(e.kind==='reset'){
    col.replaceChildren();previousMessage=null;roundStartedAt=0;roundHasReply=false;
    scrollIfFollowing(()=>add('notice',e.text,e.id,e.time));
    return;
  }
  scrollIfFollowing(()=>add(e.kind,e.text,e.id,e.time));
  if(e.kind==='approval'&&e.id!==pendingApproval){
    const card=col.querySelector('.approval[data-id="'+e.id+'"]');
    card.classList.add('done');card.querySelector('.status').textContent='审批已结束，请看后续聊天提示。';
  }
}
function revealNext(){
  if(revealTimer!==null||!revealQueue.length)return;
  const e=revealQueue[0];
  let delay=0;
  if(e.kind==='assistant')delay=Math.max(0,bubbleDelay(e.text)-(roundHasReply?0:Math.max(0,Date.now()-roundStartedAt)));
  const reveal=()=>{
    revealTimer=null;revealQueue.shift();
    if(e.kind==='user'){roundStartedAt=Date.parse(e.time)||Date.now();roundHasReply=false}
    if(e.kind==='assistant')roundHasReply=true;
    showEvent(e);setBusy(busy);revealNext();
  };
  if(delay)revealTimer=setTimeout(reveal,delay);else reveal();
}
function receiveEvent(e,initial){
  if(initial||e.history){
    if(e.kind==='user'){roundStartedAt=Date.parse(e.time)||Date.now();roundHasReply=false}
    if(e.kind==='assistant')roundHasReply=true;
    showEvent(e);
  }else{revealQueue.push(e);revealNext()}
}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(text){
  // Escape first, then allow only code blocks, inline code and bold.
  const parts=esc(text).split(/```/);
  return parts.map((p,i)=>i%2?'<pre><code>'+p.replace(/^[^\n]*\n/,'').replace(/\n$/,'')+'</code></pre>'
    :p.replace(i>0?/^\n/:/^$/,'').replace(i<parts.length-1?/\n$/:/^$/,'').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')).join('');
}
function add(kind,text,id,time){
  const d=document.createElement('div');
  if(kind==='user'||kind==='assistant'){
    const stamp=Date.parse(time)||Date.now();
    if(!previousMessage||stamp-previousMessage.time>=GROUP_GAP){
      const label=document.createElement('div');label.className='timestamp';
      label.textContent=new Date(stamp).toLocaleString();
      if(typing)col.insertBefore(label,typing);else col.appendChild(label);
    }
    const grouped=previousMessage&&previousMessage.kind===kind&&Math.abs(stamp-previousMessage.time)<GROUP_GAP;
    d.className='msg '+kind+(grouped?' grouped':'');d.innerHTML=render(text);
    previousMessage={kind,time:stamp};
  }
  else if(kind==='approval'){
    d.className='approval';d.dataset.id=id;
    const p=document.createElement('p');p.textContent=text;d.appendChild(p);
    const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');d.appendChild(status);
    for(const [label,ans,cls] of [['同意','y','yes'],['拒绝','n','']]){
      const b=document.createElement('button');b.textContent=label;b.className=cls;
      b.onclick=()=>approve(d,status,ans,id);d.appendChild(b);
    }
  } else {d.className=kind==='error'?'error':'notice';d.textContent=text}
  if(typing)col.insertBefore(d,typing);else col.appendChild(d);
}
function setBusy(b){
  busy=b;const waiting=b||revealQueue.length>0;sendBtn.disabled=waiting||sending||stopping||stopped||speechIsActive();
  if(waiting&&!typing&&!stopped){typing=document.createElement('div');typing.id='typing';typing.textContent=($('title').textContent||'')+' 正在回复…';col.appendChild(typing)}
  if((!waiting||stopped)&&typing){typing.remove();typing=null}
}
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Token':token||'','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  return r;
}
async function approve(card,status,answer,id){
  if(card.dataset.sending==='true'||card.classList.contains('done'))return;
  card.dataset.sending='true';
  card.querySelectorAll('button').forEach(b=>b.disabled=true);
  status.textContent='正在提交…';
  try{
    const r=await api('/api/approve',{answer,id});
    if(!r.ok){
      if(r.status===409){card.classList.add('done');status.textContent='这项审批已失效，未重复执行。'}
      else throw new Error(r.status);
      return;
    }
    card.classList.add('done');
    status.textContent=answer==='y'?'服务器已收到同意。':'服务器已收到拒绝。';
  }catch(e){
    status.textContent='没有收到服务器确认；正在核对审批状态。';
    try{
      const r=await api('/api/events?after='+after),s=await r.json();
      if(s.pending===Number(id)){
        card.querySelectorAll('button').forEach(b=>b.disabled=false);
        status.textContent='服务器仍在等待选择，可以重新提交。';
      }else{
        card.classList.add('done');
        status.textContent='页面没有收到确认；请看后续聊天提示。';
      }
    }catch(_){
      card.querySelectorAll('button').forEach(b=>b.disabled=false);
      status.textContent='暂时无法确认；审批仍可重试，重复操作会被服务器拒绝。';
    }
  }finally{card.dataset.sending='false'}
}
function renderActivity(record){
  $('activity-details').hidden=!record;
  if(!record){$('activity-record').textContent='';return}
  const lines=[record.started_at+' → '+record.finished_at,
    '结果：'+record.result+'；'+record.result_reason,
    '决定/结束信息：'+record.decision,
    '已留存文件：'+((record.lab_files_changed||[]).join('、')||'无')];
  for(const item of record.tools||[])lines.push(item.tool+' | '+item.path+' | '+item.state+
    (item.result_state==='结果过长'?'；结果过长，未提供给模型':''));
  if(record.next_step)lines.push('下一步：'+record.next_step);
  lines.push('本次费用：¥'+record.cost_cny);
  $('activity-record').textContent=lines.join('\n');
}
async function poll(){
  try{
    const r=await api('/api/events?after='+after);
    if(!r.ok)throw new Error(r.status);
    const s=await r.json();
    $('offline').style.display='none';
    stopping=s.stopping===true&&!s.stopped;stopped=s.stopped===true;
    $('ended').style.display=stopped?'block':'none';
    $('service-status').textContent='服务运行状态：'+(stopped?'已停止':stopping?'退出请求已收到，正在保存并关闭':'运行中');
    activityEnabled=s.activity_enabled===true;
    const next=s.next_wake_at?new Date(s.next_wake_at).toLocaleString():'今日次数已用完或尚未排期';
    const last=s.last_result?'；上次：'+s.last_result:'';
    $('activity-status').textContent='自主活动状态：'+(!activityEnabled?'已暂停':(s.autonomy_busy?'正在活动':'已开启'))+'；下次唤醒：'+next+last;
    renderActivity(s.last_activity);
    $('activity-toggle').textContent=activityEnabled?'暂停自主活动':'开启自主活动';
    $('activity-toggle').disabled=stopping||stopped||exiting;
    $('exit-service').disabled=stopping||stopped||exiting;
    document.title=s.name;$('title').textContent=s.name;
    const memoryPanel=$('memory-panel');
    memoryPanel.hidden=!s.memory_panel_url;
    memoryPanel.onclick=()=>{if(s.memory_panel_url)window.open(s.memory_panel_url,'_blank','noopener')};
    const stick=log.scrollHeight-log.scrollTop-log.clientHeight<80;
    const initial=after===0;pendingApproval=s.pending;
    for(const e of s.events){receiveEvent(e,initial);after=e.id}
    // Only the approval being asked right now can be clicked; older cards are inert.
    document.querySelectorAll('.approval').forEach(c=>{
      if(Number(c.dataset.id)!==s.pending){
        c.classList.add('done');
        const status=c.querySelector('.status');
        if(status&&!status.textContent)status.textContent='审批已结束，请看后续聊天提示。';
      }
    });
    setBusy(s.busy);
    if(s.events.length&&stick)log.scrollTop=log.scrollHeight;
  }catch(e){$('offline').style.display='block';$('service-status').textContent='服务运行状态：连接中断';$('activity-toggle').disabled=true;$('exit-service').disabled=true}
  setTimeout(poll,600);
}
async function send(text){
  const fromBox=!text;
  text=(text||box.value).trim();
  if(!text||busy||revealQueue.length||stopping||stopped||sending||speechIsActive())return;
  if(fromBox&&draftText!==text){draftText=text;draftId=crypto.randomUUID()}
  const requestId=fromBox?draftId:crypto.randomUUID();
  sending=true;setBusy(true);
  try{
    const r=await api('/api/send',{text,request_id:requestId});
    let result={};try{result=await r.json()}catch(e){}
    if(!r.ok){
      add('error',r.status===409&&result.error==='busy'
        ?'Peter 正在处理上一条消息；这条没有发送，输入已保留。'
        :'发送未成功，输入已保留；可以稍后重新操作。');
    }else{
      if(fromBox){
        if(box.value.trim()===text){
          box.value='';resizeBox();
          try{sessionStorage.removeItem(speechDraftKey)}catch(e){}
          speechDraftActive=false;
        }
        draftId=null;draftText=null;
      }
      if(result.duplicate)add('notice','这条消息此前已提交，没有重复发送。');
    }
  }catch(e){add('error','发送结果未确认，输入已保留；页面不会自动重发。')}
  finally{sending=false;log.scrollTop=log.scrollHeight}
}
$('new-chat').onclick=()=>{
  if(busy||sending||stopping||stopped||revealQueue.length||speechIsActive())return;
  if(confirm('开始新对话？旧聊天仍保存在本机，记忆和实验室文件不会清除。'))send('/new');
};
sendBtn.onclick=()=>send();
box.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!speechIsActive())send()}
});
box.addEventListener('input',()=>{resizeBox();if(speechDraftActive)saveSpeechDraft(box.value)});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));
$('activity-toggle').onclick=async()=>{
  $('activity-toggle').disabled=true;
  try{
    const r=await api('/api/activity',{enabled:!activityEnabled});
    if(!r.ok)throw new Error(r.status);
    activityEnabled=!activityEnabled;
    $('activity-status').textContent='自主活动状态：'+(activityEnabled?'已开启':'已暂停');
    $('activity-toggle').textContent=activityEnabled?'暂停自主活动':'开启自主活动';
  }catch(e){add('error','自主活动状态保存失败，请检查连接后重试。')}
  finally{$('activity-toggle').disabled=stopping||stopped||exiting}
};
$('exit-service').onclick=async()=>{
  if(exiting||stopped||!confirm('确定退出 Peter 网页服务吗？'))return;
  exiting=true;$('exit-service').disabled=true;$('activity-toggle').disabled=true;
  $('service-status').textContent='服务运行状态：正在退出…';
  try{
    const r=await api('/api/exit',{});
    let result={};try{result=await r.json()}catch(e){}
    if(!r.ok||!result.ok)throw new Error(r.status);
    if(result.state==='stopped'){
      stopping=false;stopped=true;
      $('ended').style.display='block';$('service-status').textContent='服务运行状态：已停止';
      sendBtn.disabled=true;$('activity-toggle').disabled=true;$('exit-service').disabled=true;
    }else if(result.state==='accepted'||result.state==='stopping'){
      exiting=false;stopping=true;
      $('ended').style.display='none';
      $('service-status').textContent='服务运行状态：退出请求已收到，正在保存并关闭';
      sendBtn.disabled=true;$('activity-toggle').disabled=true;$('exit-service').disabled=true;
    }else throw new Error('invalid exit response');
  }catch(e){
    exiting=false;
    $('service-status').textContent='服务运行状态：退出结果未确认，正在核对';
    add('error','没有收到退出确认；页面会继续核对服务状态，请不要重复启动。');
  }
};
function theme(t){
  if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  const dark=t==='dark';
  $('theme').textContent=dark?'浅色':'深色';
}
try{theme(localStorage.getItem('veil-theme'))}catch(e){theme(null)}
$('theme').onclick=()=>{
  const dark=$('theme').textContent==='浅色',t=dark?'light':'dark';
  theme(t);try{localStorage.setItem('veil-theme',t)}catch(e){}
};
setBusy(true);poll();box.focus();
</script>
</body>
</html>
