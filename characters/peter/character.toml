name = "Peter"
# Change this one line to "gpt" to select the complete alternate profile.
provider = "deepseek"
persona = "persona/peter.md"
history_rounds = 20
max_output_tokens = 1024

[providers.deepseek]
model = "deepseek-flash"
thinking = "disabled"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
max_input_tokens = 32768
# CNY per million tokens, peak rates; off-peak savings are not assumed.
# Verify against https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
input_cny_per_million = "2"
cached_input_cny_per_million = "0.04"
output_cny_per_million = "8"

[providers.gpt]
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_input_tokens = 32768
# Conservative local CNY rates, not a live exchange-rate quotation.
input_cny_per_million = "4"
cached_input_cny_per_million = "1"
output_cny_per_million = "16"

[memory]
enabled = true
# "native": Peter saves memories himself with the hold tool (ticket 007).
# "extract": the old background supplement every four rounds; switch back to compare.
mode = "native"
# Ombre's own tagging and same-event merge use the chat model and key; false keeps default tags only.
ombre_model = true
model = "BAAI/bge-m3"
base_url = "https://api.siliconflow.cn/v1"
dimensions = 1024
# Official price checked 2026-10-19: https://siliconflow.cn/pricing
# This is the free model, NOT Pro/BAAI/bge-m3. Update together when switching.
input_cny_per_million = "0"

[tools]
max_output_tokens = 4096
persistent_append_file = "growth-journal.md"
lab = "lab"
lab_max_write_bytes = 200000
enabled = true
folder = "data/peter/workspace"
max_steps = 12
max_result_bytes = 8192
