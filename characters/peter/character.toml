name = "Peter"
# Change this one line to "gpt" to select the complete alternate profile.
provider = "deepseek"
persona = "persona/peter.md"
# Ticket 356: about one day of Lan's chat (median 82 rounds a day); the window drops 20 old rounds at a time.
history_rounds = 80
max_output_tokens = 1024

[voice]
provider = "minimax"

[providers.deepseek]
model = "deepseek-flash"
thinking = "enabled"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
max_input_tokens = 100000
# CNY per million tokens, peak rates; off-peak savings are not assumed.
# Verify against https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
input_cny_per_million = "2"
cached_input_cny_per_million = "0.04"
output_cny_per_million = "8"

[providers.gpt]
model = "gpt-4.1-mini"
# The workbench declares this only when Lan selects this existing visual profile.
input_modalities = ["text", "image"]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_input_tokens = 32768
# Conservative local CNY rates, not a live exchange-rate quotation.
input_cny_per_million = "4"
cached_input_cny_per_million = "1"
output_cny_per_million = "16"

[memory]
enabled = true
# Peter saves memories himself with the hold tool (ticket 007); "native" is the only mode.
mode = "native"
model = "BAAI/bge-m3"
base_url = "https://api.siliconflow.cn/v1"
dimensions = 1024
# Official price checked 2026-10-19: https://siliconflow.cn/pricing
# This is the free model, NOT Pro/BAAI/bge-m3. Update together when switching.
input_cny_per_million = "0"
# Ticket 353 / 419: automatic recall. On by default with these values; to change one, add the table
# right here, after the [memory] keys and before the next section. enabled = false restores the old behaviour.
# [memory.recall]
# cooldown_turns = 3        # a memory shown automatically skips the next 3 turns unless Lan asks about the past or follows up on it (0 = off); kept across restarts
# dedup = true              # one memory per event: Ombre same_event/continuation links or stored vectors >= dedup_similarity
# dedup_similarity = 0.88
# excerpt_chars = 0         # 0 = whole story; the request budget decides how many fit. An old positive value still limits each memory, cut at a paragraph/sentence boundary
# random_chance = 0.1       # legacy: still parsed, never used as a probability by ticket 422; 0 keeps association off for old configs
# rotation_candidates = 8   # candidate pool for autonomous wakes; there is no fixed number shown
# Ticket 422 weak natural association. It is scored, not drawn: importance, turns since it last
# surfaced, cooldown, and whether this moment is light enough. There is no every-N-turns rule;
# "nothing suitable" is a normal result. Put these keys inside the [memory.recall] table above
# (one table only), for example by adding these lines after rotation_candidates:
# association_enabled = true
# association_min_importance = 4   # below this stored importance a memory is not personal enough to surface unasked
# association_cooldown_turns = 8    # a memory that just surfaced stays out this many turns
# association_light_chars = 40      # longer messages (or work/bug/log topics) get no association
# Ticket 382 / 419: a small relevance judge for automatic recall. ON by default. Lan's switch on the memory page ("想起判官")
# overrides `enabled` and acts at once; turning it off restores ticket 381's recall and changes no memory.
# The judge looks at Ombre's hits plus the nearest memories by vector and may pick every candidate that bears directly on her
# sentence (or none: then nothing is recalled); the request budget decides how many fit. Cards include the opening and the
# ending, so a question about the end of a story can still be judged. Any technical failure (timeout, request error, bad answer)
# keeps ticket 381's recall for that turn; three in a row pause the judge for breaker_seconds. To change a value, add this table:
# [memory.recall_judge]
# enabled = true
# timeout_seconds = 4.0     # longest the judge may add to one message when it fails (normal: about 1.1-1.5 s; the first message after start up to ~3 s)
# ombre_candidates = 8
# vector_candidates = 8
# breaker_failures = 3
# breaker_seconds = 300
# Ticket 354: the program's fallback memory. When enough new chat has piled up and you two have gone quiet,
# the chat model (as Peter) reads only the messages you sent each other and writes down what he would remember,
# or nothing. Lan's switch on the memory page overrides `enabled`. This table must stay below the [memory] keys.
# Ticket 187: for a short message that needs the last rounds ("try again"), search again with those rounds
# and keep only memories whose stored vector is close to that text; none may remain. OFF until
# min_similarity is calibrated on real memory text. To turn it on, add this table right here, after the
# [memory] keys and before the next section:
# [memory.recall_context]
# enabled = true
# min_similarity = <fill in the calibrated value; the table is ignored without a number>
# short_chars = 12
# rounds = 2

[memory.experience]
enabled = true
min_chars = 3000            # new visible chat needed before he tidies it (then he waits until you are quiet)
idle_minutes = 30
floor_chars = 200           # less than this is never looked at, even at the end of the day
day_end = "23:30"           # after this (or once the date has changed) a smaller amount is looked at too
day_end_idle_minutes = 10
daily_budget_cny = "1"      # Lan 2026-11-14: chat model, at most ¥1 a day
recent_days = 3             # entries this new are placed before the chat history; 0 = only normal recall
recent_chars = 1500

[memory.events]
# Ticket 421: one experience, one memory. Peter's own saves and the background tidy first look for the
# experience a new part belongs to; a real development continues it, an unrelated thing starts a new one.
# `enabled = false` restores the old one-memory-per-save path; the event ledger stays on disk.
enabled = true
# stage_chars = 0            # 0 keeps the whole stage; the model's real output budget is the limit
# summary_chars = 0         # 0 lets Ombre index the whole story; chat recall still obeys its token budget
# story_batch_chars = 12000 # long events are merged in batches, never by cutting the request JSON
# timeline_page = 20
# evidence_minutes = 30

# Ticket 430 / P3-2: automatic recall always uses VEIL Brain's vector + jieba/BM25 index.
[memory.retrieval]
# weight_vector = 0.65
# weight_keyword = 0.35

[tools]
max_output_tokens = 4096
persistent_append_file = "growth-journal.md"
lab = "lab"
lab_max_write_bytes = 200000
enabled = true
folder = "data/peter/workspace"
max_steps = 20
# Tickets 216 and 357: these abilities are opened by Peter with expand_capability; tool_groups.py says which tools
# are always offered. To go back to the grouping before ticket 357, use the next line instead:
# tool_groups = ["web", "github", "social", "desktop_control"]
tool_groups = ["web", "github", "desktop_control", "memory_admin", "build", "desktop_files", "garden_forum", "garden_play", "garden_more", "nowhere", "xiaohongshu", "other"]
max_result_bytes = 8192
python_sandbox = true

[context]
# Ticket 390: a program-built checkpoint of unfinished ordinary-chat work survives a new conversation.
# It only reports verified operations and the long task's own next step; no goal is guessed from tools.
# false stops writing/injecting it; the context page still lets Lan end an existing one.
work_checkpoint = true

[autonomy]
# Four B two wake limits are role configurable; total program budget remains unchanged.
interval_minutes = 90
daily_max_runs = 12
daily_budget_cny = "3"
min_alarm_gap_minutes = 15
# Ticket 133: no autonomous wakes 01:00-06:00 local time while Lan keeps this on (activity page switch).
quiet_hours = "01:00-06:00"
quiet_hours_enabled = true
# Wakes, glances and Codex reminders may use a larger input window; ordinary chat keeps the provider limit.
max_input_tokens = 100000
# Ticket 225: one wake stops after spending this much (or 60 tool steps, or 15 minutes); the daily pool is unchanged.
run_budget_cny = "0.25"
max_tool_steps = 60
# Ticket 389: wake prompt keeps a short factual record of work spanning several wakes, plus files already
# read and unchanged. It never asks Peter to continue. false removes both blocks.
threads = true

[glance]
enabled = true
min_interval_minutes = 15
max_interval_minutes = 40
idle_seconds = 300
max_steps = 4
daily_budget_cny = "1"

[profile]
# Ticket 394: Learned Context replaces the single about-lan.md blob. The old file is kept as the
# migration source; facts, growth, ongoing and the relationship items share one 4,000-byte budget.
file = "learned-context.json"
learned = true
legacy_file = "about-lan.md"
max_bytes = 4000
# Ticket 422: the small stable relationship base carried into every normal request. It is built from
# the relationship items (confirmed / uncertain / outdated) in the same file, whole items only, and it
# is never dropped silently: a part that no longer fits is recorded as degraded. To change these
# values, add this table right here (before the next section):
# [profile.relationship_base]
# enabled = true
# max_chars = 480
# max_items = 8
# A relationship item Peter saves only counts as current ("confirmed") when it cites a message Lan
# actually sent (chat:<message_id>, verified against this role's chat log). A memory/event pointer alone
# is kept as a trace but does not make it consensus; his own reading stays "uncertain". The exception is
# Lan's own edit on this page: she is the source, so what she marks confirmed is current.

[user_persona]
# Ticket 394: Lan's own persona, separate from Peter's notes about her.
file = "lan.md"
max_bytes = 4000

[email]
# Ticket 098: Peter and Lan talk by email (QQ Mail IMAP/SMTP). Inert until the three
# PETER_EMAIL_ADDRESS / PETER_EMAIL_AUTH_CODE / LAN_EMAIL_ADDRESS values are in .env.
enabled = true
poll_seconds = 60
daily_max_sent = 20

[qq]
# Ticket 102: Peter and Lan talk on QQ by operating his logged-in QQ window (Windows UI Automation,
# no injection). Inert until QQ_LAN_CONTACT (Lan's name as shown in his QQ chat) is in .env.
enabled = true
poll_seconds = 20
# QQ is read and written only after the keyboard and mouse have been untouched this long.
idle_seconds = 120
daily_max_sent = 100

[web]
# Dedicated human login required. Only reads; external actions have no executable entry point.
xiaohongshu_readonly = true
browser_interaction = true
# Ticket 099: direct-use, read-only public web search and fetch tools.
enabled = true
# Public research only. No developer GitHub credentials or write tools are exposed.
github_readonly = true
github_repository = "yecays-ai/veil-agent"

[windows_observation]
# Ticket 111: read-only window discovery and UIA observation. Screenshot fallback is transient
# and uses Peter's existing vision-capable chat model. Other characters remain disabled by default.
enabled = true

[screen_pop]
# Ticket 115: Peter can show popups or danmaku through the VEIL Desktop shell.
enabled = true

[windows_interaction]
# Ticket 112: application paths and process identities are maintained in windows-apps.toml.
enabled = true
apps_file = "windows-apps.toml"
# A short idle window keeps the prompt's own final keystroke from blocking a requested action.
idle_seconds = 3

[desktop_file_read]
# Ticket 151: independent, read-only access to visible text files on the Windows Desktop.
enabled = true

[short_term_notes]
# Ticket 123: temporary conversation notes; never written to Ombre or Plan.
# Ticket 208: off by default (Lan 2026-11-02: no visible benefit, only cost). Set true to resume background extraction.
enabled = false

