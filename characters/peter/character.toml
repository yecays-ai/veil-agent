name = "Peter"
# Change this one line to "gpt" to select the complete alternate profile.
provider = "deepseek"
persona = "persona/peter.md"
history_rounds = 20
max_output_tokens = 1024

[voice]
provider = "minimax"

[providers.deepseek]
model = "deepseek-flash"
thinking = "enabled"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
max_input_tokens = 32768
# CNY per million tokens, peak rates; off-peak savings are not assumed.
# Verify against https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
input_cny_per_million = "2"
cached_input_cny_per_million = "0.04"
output_cny_per_million = "8"

[providers.gpt]
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_input_tokens = 32768
# Conservative local CNY rates, not a live exchange-rate quotation.
input_cny_per_million = "4"
cached_input_cny_per_million = "1"
output_cny_per_million = "16"

[memory]
enabled = true
# Peter saves memories himself with the hold tool (ticket 007); "native" is the only mode.
mode = "native"
# Ombre's own tagging and same-event merge use the chat model and key; false keeps default tags only.
ombre_model = true
# Role-local Ombre HTTP listener; future roles must choose a distinct port.
ombre_port = 18011
model = "BAAI/bge-m3"
base_url = "https://api.siliconflow.cn/v1"
dimensions = 1024
# Official price checked 2026-10-19: https://siliconflow.cn/pricing
# This is the free model, NOT Pro/BAAI/bge-m3. Update together when switching.
input_cny_per_million = "0"

[tools]
max_output_tokens = 4096
persistent_append_file = "growth-journal.md"
lab = "lab"
lab_max_write_bytes = 200000
enabled = true
folder = "data/peter/workspace"
max_steps = 20
max_result_bytes = 8192

[autonomy]
# Four B two wake limits are role configurable; total program budget remains unchanged.
interval_minutes = 90
daily_max_runs = 12
daily_budget_cny = "3"
min_alarm_gap_minutes = 15
# Ticket 133: no autonomous wakes 01:00-06:00 local time while Lan keeps this on (activity page switch).
quiet_hours = "01:00-06:00"
quiet_hours_enabled = true
# Wakes, glances and Codex reminders may use a larger input window; ordinary chat keeps the provider limit.
max_input_tokens = 65536

[glance]
enabled = true
min_interval_minutes = 15
max_interval_minutes = 40
idle_seconds = 300
max_steps = 4
daily_budget_cny = "1"

[profile]
# Ticket 096: Peter's own notes about Lan, written by him with profile_append / profile_replace
# and sent right after the persona every request. Lives at data/peter/<file>.
file = "about-lan.md"
max_bytes = 3000

[email]
# Ticket 098: Peter and Lan talk by email (QQ Mail IMAP/SMTP). Inert until the three
# PETER_EMAIL_ADDRESS / PETER_EMAIL_AUTH_CODE / LAN_EMAIL_ADDRESS values are in .env.
enabled = true
poll_seconds = 60
daily_max_sent = 20

[qq]
# Ticket 102: Peter and Lan talk on QQ by operating his logged-in QQ window (Windows UI Automation,
# no injection). Inert until QQ_LAN_CONTACT (Lan's name as shown in his QQ chat) is in .env.
enabled = true
poll_seconds = 20
# QQ is read and written only after the keyboard and mouse have been untouched this long.
idle_seconds = 120
daily_max_sent = 100

[web]
# Ticket 099: direct-use, read-only public web search and fetch tools.
enabled = true

[windows_observation]
# Ticket 111: read-only window discovery and UIA observation. Screenshot fallback is transient
# and uses Peter's existing vision-capable chat model. Other characters remain disabled by default.
enabled = true

[screen_pop]
# Ticket 115: Peter can show popups or danmaku through the VEIL Desktop shell.
enabled = true

[windows_interaction]
# Ticket 112: application paths and process identities are maintained in windows-apps.toml.
enabled = true
apps_file = "windows-apps.toml"
# A short idle window keeps the prompt's own final keystroke from blocking a requested action.
idle_seconds = 3

[desktop_file_read]
# Ticket 151: independent, read-only access to visible text files on the Windows Desktop.
enabled = true

[windows_media]
# Ticket 151: read-only Windows media-session status and metadata; no audio or controls.
enabled = true

[short_term_notes]
# Ticket 123: temporary conversation notes; never written to Ombre or Plan.
enabled = true
