# Each app is an explicit executable and process-path allowlist.
# Add another table here to authorize another app without changing Agent code.

[applications.notepad]
label = "Notepad"
launch_path = "%SystemRoot%\\System32\\notepad.exe"
process_paths = [
  "%SystemRoot%\\System32\\notepad.exe",
  "%ProgramFiles%\\WindowsApps\\Microsoft.WindowsNotepad_*\\Notepad\\Notepad.exe",
]
actions = [
  "activate", "minimize", "restore", "invoke", "select", "toggle",
  "expand", "collapse", "set_text",
]

# The standard installed Microsoft Edge app. Its only browser permission is to open public
# HTTP(S) pages and expose the current window through the existing read-only UIA observer.
# Browser controls are intentionally absent, so Peter cannot log in, click purchases, publish,
# or start downloads through the browser UI.
[applications.edge]
label = "Microsoft Edge"
launch_path = "%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe"
process_paths = [
  "%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe",
]
actions = ["activate", "minimize", "restore"]
public_web = true
