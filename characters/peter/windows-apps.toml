# Each app is an explicit executable and process-path allowlist.
# Add another table here to authorize another app without changing Agent code.

[applications.notepad]
label = "Notepad"
launch_path = "%SystemRoot%\\System32\\notepad.exe"
process_paths = [
  "%SystemRoot%\\System32\\notepad.exe",
  "%ProgramFiles%\\WindowsApps\\Microsoft.WindowsNotepad_*\\Notepad\\Notepad.exe",
]
actions = [
  "activate", "minimize", "restore", "invoke", "select", "toggle",
  "expand", "collapse", "set_text",
]

# Peter opens public pages in an isolated Chrome Guest window. Runtime launch also uses a fresh
# temporary user-data directory and incognito mode, so Chrome policies that disable Guest cannot
# expose Lan's personal profile. Browser window controls and page actions are not authorized.
[applications.chrome]
label = "Google Chrome Guest"
launch_path = "%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe"
process_paths = [
  "%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe",
]
actions = []
public_web = true
