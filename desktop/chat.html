<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' blob: http://127.0.0.1:*; connect-src 'none';">
  <title>VEIL · Peter</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="ended">服务已退出。重新打开 Peter 可再次连接。</div>
  <div id="offline">和 Peter 的本机服务暂时断开。<button id="reconnect" type="button">重新连接</button></div>
  <header class="topbar">
    <div class="identity"><img src="assets/pep.png" alt=""><div><h1 id="title">Peter</h1><span id="service-status">正在连接…</span></div></div>
    <div class="top-actions"><span id="activity-status" title="自主活动状态"></span><button id="toolbar-toggle" aria-label="聊天工具" title="聊天工具">•••</button><button id="expand" aria-label="展开聊天" title="展开">↗</button><button id="collapse" aria-label="收起聊天" title="收起">—</button></div>
  </header>
  <section id="tool-panel" hidden>
    <div class="tool-row">
      <button id="new-chat" title="保留旧聊天，开始一段新聊天">新对话</button>
      <button data-cmd="/cost">花费</button>
      <button data-cmd="/memory">记忆</button>
      <button id="capability-record">能力记录</button>
      <button id="memory-panel" hidden>Memory / Ombre</button>
      <button id="theme">浅色</button>
    </div>
    <details id="capability-details">
      <summary>Peter 的能力更新记录</summary>
      <h3>Current capabilities</h3><pre id="current-capabilities-text"></pre>
      <h3>Capability change history</h3><pre id="capability-record-text"></pre>
    </details>
    <div id="runtime">
      <span class="label" id="service-status-detail">服务运行状态：正在连接…</span>
      <button id="activity-toggle" disabled>读取中…</button>
      <button id="exit-service" disabled>退出服务</button>
    </div>
    <details id="activity-details" hidden><summary>上次自主活动详情</summary><pre id="activity-record"></pre></details>
  </section>
  <main id="log"><div class="col" id="col" aria-live="polite"></div></main>
  <footer>
    <div id="image-preview" class="image-preview" hidden></div>
    <div class="composer" id="composer">
      <div class="voice-tools">
        <select id="speech-language" aria-label="听写语言" title="听写语言"><option value="zh-CN">中</option><option value="en-US">EN</option></select>
        <button id="speech-toggle" type="button" aria-label="开始语音识别" aria-pressed="false" title="语音听写；识别可能使用在线服务">🎙</button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <button id="image-button" type="button" aria-label="添加图片" title="添加图片">＋</button>
        <button id="voice-hold" type="button" aria-label="按住说话">按住说话</button>
      </div>
      <span id="speech-status" role="status" aria-live="polite">语音输入就绪</span>
      <textarea id="box" rows="1" placeholder="和 Peter 说点什么…"></textarea>
      <button id="send" aria-label="发送">↑</button>
    </div>
  </footer>
  <script src="chat.js"></script>
</body>
</html>
